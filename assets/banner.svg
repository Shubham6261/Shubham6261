<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="math-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters for Neon Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>

  <!-- Decorative LaTeX Math Watermarks (Background ambient formulas) -->
  <g fill="#38bdf8" fill-opacity="0.07" font-family="'Cambria Math', 'STIX Two Math', 'Times New Roman', serif" font-style="italic">
    <text x="50" y="80" font-size="28">\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}</text>
    <text x="850" y="70" font-size="26">\mathcal{O}(N \log N) \quad \mathbf{A}\mathbf{x} = \lambda\mathbf{x}</text>
    <text x="780" y="310" font-size="24">\nabla \times \mathbf{E} = -\frac{\partial \mathbf{B}}{\partial t}</text>
    <text x="60" y="310" font-size="25">\mathcal{L}_{\text{system}} = \sum_{i=1}^n \omega_i \phi_i(x)</text>
    <text x="920" y="190" font-size="32">f(n) \in \Theta(g(n))</text>
  </g>

  <!-- Glowing Geometric Curves & Vectors -->
  <path d="M -50 200 Q 300 80 600 220 T 1250 140" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <path d="M -50 240 Q 400 320 750 160 T 1250 220" fill="none" stroke="url(#text-grad)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="600" cy="220" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="750" cy="160" r="4" fill="#c084fc" filter="url(#glow)"/>

  <!-- Header Card Container -->
  <rect x="60" y="45" width="1080" height="250" rx="12" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1.5"/>

  <!-- LaTeX Style Notation Badge Top Left -->
  <g transform="translate(90, 72)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="15" y="20" font-family="'Courier New', monospace" font-size="13" fill="#38bdf8" font-weight="bold">\documentclass{Shubham}</text>
  </g>

  <!-- Main Name Header with Glowing Gradient -->
  <text x="90" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#text-grad)" filter="url(#subtle-glow)" letter-spacing="1">
    SHUBHAM
  </text>
  <text x="330" y="148" font-family="'Cambria Math', 'Times New Roman', serif" font-size="34" fill="#94a3b8" font-style="italic">
    [Software &amp; TeX Engineer]
  </text>

  <!-- Subtitle / Role Info -->
  <text x="90" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#e2e8f0" font-weight="500">
    Backend Architect <tspan fill="#38bdf8">•</tspan> .NET &amp; C# Developer <tspan fill="#818cf8">•</tspan> Algorithms &amp; TeX Layout Specialist
  </text>

  <!-- Dynamic Feature Badges inside Banner -->
  <!-- Badge 1: C# & .NET -->
  <g transform="translate(90, 215)">
    <rect width="130" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">⚡ .NET Core / C#</text>
  </g>

  <!-- Badge 2: Algorithms & DSA -->
  <g transform="translate(230, 215)">
    <rect width="150" height="32" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">🧮 Algorithms &amp; DSA</text>
  </g>

  <!-- Badge 3: TeX / LaTeX Engineering -->
  <g transform="translate(390, 215)">
    <rect width="170" height="32" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="1"/>
    <text x="12" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">📄 TeX / LaTeX Systems</text>
  </g>

  <!-- Right Side Interactive Mathematical Formula Showcase Box -->
  <g transform="translate(680, 75)">
    <rect width="430" height="190" rx="10" fill="#070a13" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Terminal Header Bar -->
    <path d="M 680 75 L 1110 75" stroke="#1e293b" stroke-width="1"/>
    <circle cx="702" cy="93" r="5" fill="#ef4444"/>
    <circle cx="718" cy="93" r="5" fill="#eab308"/>
    <circle cx="734" cy="93" r="5" fill="#22c55e"/>
    <text x="750" y="97" font-family="monospace" font-size="12" fill="#64748b">profile.tex - LaTeX Compilation</text>

    <!-- Formula Lines inside right box -->
    <text x="700" y="132" font-family="'Courier New', monospace" font-size="13" fill="#f43f5e">\begin<tspan fill="#38bdf8">{profile}</tspan><tspan fill="#e2e8f0">[Shubham]</tspan></text>
    <text x="715" y="155" font-family="'Cambria Math', serif" font-size="15" fill="#38bdf8" font-style="italic">
      \mathcal{O}(\text{Complexity}) = \mathcal{O}(1) \text{ optimal}
    </text>
    <text x="715" y="180" font-family="'Cambria Math', serif" font-size="15" fill="#a855f7" font-style="italic">
      \mathbf{Skill} = \sum_{i} \text{Code}_i + \int \text{Innovation} \, dt
    </text>
    <text x="715" y="205" font-family="'Courier New', monospace" font-size="13" fill="#10b981">\pdfoutput=1 \documentclass{article}</text>
    <text x="700" y="230" font-family="'Courier New', monospace" font-size="13" fill="#f43f5e">\end<tspan fill="#38bdf8">{profile}</tspan></text>
  </g>
</svg>
